# ============================================================
# AICHAT GraphQL Schema
# ============================================================

# ------ Types ------

type User {
  loginId: ID!
  displayName: String!
  email: String!
}

type UserConversation {
  loginId: ID!
  conversationId: ID!
  joinedAt: AWSDateTime!
  role: String! # 'creator' | 'participant' | 'inactive'
  lastMessageId: String
  lastUpdatedAt: AWSDateTime
}

type Message {
  conversationId: ID!
  messageId: ID!
  userId: String!
  displayName: String!
  content: String!
  timestamp: AWSDateTime!
  isUsedInSummary: Boolean
}

type Summary {
  conversationId: ID!
  title: String
  current: String
  previous: String
  updatedAt: AWSDateTime
  updatedBy: String
  selectedPromptType: String
  customPromptText: String
}

type PromptTemplate {
  promptType: String!
  promptText: String!
  updatedAt: AWSDateTime
}

type Lock {
  conversationId: ID!
  lockType: String!
  userId: String!
  operationType: String!
  startTime: AWSDateTime!
  ttl: Int
}

type Conversation {
  conversationId: ID!
  createdBy: String!
  createdAt: AWSDateTime!
  participants: [String!]!
  status: String!
  shareLink: String
  title: String
}

type Notification {
  conversationId: ID!
  type: String!
  message: String!
  userId: String
  timestamp: AWSDateTime!
}

type KnowledgeSource {
  conversationId: ID!
  fileName: String!
  originalFileName: String!
  fileSize: Int!
  s3Key: String!
  contentType: String!
  uploadedBy: String!
  uploadedAt: AWSDateTime!
  status: String!
  errorMessage: String
}

type KnowledgeSearchResult {
  conversationId: ID!
  query: String!
  answer: String!
  sources: [String!]!
  sourceDisplayNames: [String!]!
  userMessageId: ID
  aiMessageId: ID
}

type UploadKnowledgebaseResponse {
  success: Boolean!
  knowledgeSource: KnowledgeSource
  presignedUrl: String
  error: String
}

type CompleteKnowledgebaseUploadResponse {
  success: Boolean!
  error: String
}

type DeleteKnowledgebaseResponse {
  success: Boolean!
  fileName: String
  error: String
}

# ------ Inputs ------

input SendMessageInput {
  conversationId: ID!
  userId: String!
  displayName: String
  content: String!
}

input UpdateSummaryInput {
  conversationId: ID!
  userId: String!
  displayName: String
  selectedMessageIds: [String!]!
}

input SaveSummaryEditInput {
  conversationId: ID!
  userId: String!
  displayName: String
  content: String!
}

input UpdateSummaryPromptTypeInput {
  conversationId: ID!
  selectedPromptType: String!
  customPromptText: String
}

input UpdatePromptTemplateInput {
  promptType: String!
  promptText: String!
}

input CompleteKnowledgebaseUploadInput {
  conversationId: ID!
  fileName: String!
}

input AcquireLockInput {
  conversationId: ID!
  userId: String!
  operationType: String!
}

input ReleaseLockInput {
  conversationId: ID!
  userId: String!
}

input AskAIHelperInput {
  conversationId: ID!
  userId: String!
  actionType: String!
  userInput: String
  selectedMessageIds: [String]
}

input CreateConversationInput {
  createdBy: String!
}

input UpdateConversationTitleInput {
  conversationId: ID!
  title: String!
}

input JoinConversationInput {
  loginId: String!
  conversationId: ID!
}

input LeaveConversationInput {
  loginId: String!
  conversationId: ID!
}

input UpdateLastMessageIdInput {
  loginId: String!
  conversationId: ID!
  messageId: ID!
}

input UploadKnowledgebaseInput {
  conversationId: ID!
  fileName: String!
  fileSize: Int!
  contentType: String!
  uploadedBy: String
}

input DeleteKnowledgebaseInput {
  conversationId: ID!
  fileName: String!
}

input SearchKnowledgebaseInput {
  conversationId: ID!
  query: String!
  userId: String!
  displayName: String!
}

# ------ Responses ------

type CreateConversationResponse {
  success: Boolean!
  conversation: Conversation
  error: String
}

type JoinConversationResponse {
  success: Boolean!
  conversation: Conversation
  error: String
}

type LeaveConversationResponse {
  success: Boolean!
  conversationId: ID
  error: String
}

type UpdateLastMessageIdResponse {
  success: Boolean!
  userConversation: UserConversation
  error: String
}

# ------ Queries ------

type Query {
  getConversation(conversationId: ID!): Conversation
  listConversations(loginId: ID!): [Conversation!]!
  listMessages(
    conversationId: ID!
    limit: Int
    nextToken: String
  ): MessageConnection!
  getSummary(conversationId: ID!): Summary
  getPromptTemplate(promptType: String!): PromptTemplate
  listPromptTemplates: [PromptTemplate!]!
  getLocks(conversationId: ID!): [Lock!]!
  listKnowledgeSources(conversationId: ID!): [KnowledgeSource!]!
}

type MessageConnection {
  items: [Message!]!
  nextToken: String
}

# ------ Mutations ------

type Mutation {
  createConversation(
    input: CreateConversationInput!
  ): CreateConversationResponse!
  joinConversation(input: JoinConversationInput!): JoinConversationResponse!
  leaveConversation(input: LeaveConversationInput!): LeaveConversationResponse!
  updateLastMessageId(
    input: UpdateLastMessageIdInput!
  ): UpdateLastMessageIdResponse!
  # Subscription対応: 単純な型を返す
  sendMessage(input: SendMessageInput!): Message!
  updateSummary(input: UpdateSummaryInput!): Summary!
  undoSummary(conversationId: ID!): Summary!
  saveSummaryEdit(input: SaveSummaryEditInput!): Summary!
  updateSummaryPromptType(input: UpdateSummaryPromptTypeInput!): Summary!
  updatePromptTemplate(input: UpdatePromptTemplateInput!): PromptTemplate!
  acquireLock(input: AcquireLockInput!): Lock!
  releaseLock(input: ReleaseLockInput!): Lock!
  askAIHelper(input: AskAIHelperInput!): Message!
  updateConversationTitle(input: UpdateConversationTitleInput!): Conversation!
  uploadKnowledgebase(
    input: UploadKnowledgebaseInput!
  ): UploadKnowledgebaseResponse!
  completeKnowledgebaseUpload(
    input: CompleteKnowledgebaseUploadInput!
  ): CompleteKnowledgebaseUploadResponse!
  deleteKnowledgebase(
    input: DeleteKnowledgebaseInput!
  ): DeleteKnowledgebaseResponse!
  searchKnowledgebase(input: SearchKnowledgebaseInput!): KnowledgeSearchResult!
}

# ------ Subscriptions ------

type Subscription {
  onNewMessage(conversationId: ID!): Message
    @aws_subscribe(mutations: ["sendMessage"])
  onSummaryUpdate(conversationId: ID!): Summary
    @aws_subscribe(
      mutations: [
        "updateSummary"
        "saveSummaryEdit"
        "undoSummary"
        "updateSummaryPromptType"
      ]
    )
  onLockChange(conversationId: ID!): Lock
    @aws_subscribe(mutations: ["acquireLock", "releaseLock"])
}
