# ============================================================
# AICHAT GraphQL Schema
# ============================================================

# ------ Types ------

type User {
  loginId: ID!
  displayName: String!
  email: String!
}

type UserConversation {
  loginId: ID!
  conversationId: ID!
  joinedAt: AWSDateTime!
  role: String # e.g., "owner", "participant"
}

type Message {
  conversationId: ID!
  messageId: ID!
  userId: String!
  displayName: String!
  content: String!
  timestamp: AWSDateTime!
  isUsedInSummary: Boolean
}

type Summary {
  conversationId: ID!
  title: String
  current: String
  previous: String
  updatedAt: AWSDateTime
  updatedBy: String
}

type Lock {
  conversationId: ID!
  lockType: String!
  userId: String!
  operationType: String!
  startTime: AWSDateTime!
  ttl: Int
}

type Conversation {
  conversationId: ID!
  createdBy: String!
  createdAt: AWSDateTime!
  participants: [String!]!
  status: String!
  shareLink: String
  title: String
}

type Notification {
  conversationId: ID!
  type: String!
  message: String!
  userId: String
  timestamp: AWSDateTime!
}

# ------ Inputs ------

input SendMessageInput {
  conversationId: ID!
  userId: String!
  displayName: String
  content: String!
}

input UpdateSummaryInput {
  conversationId: ID!
  userId: String!
  selectedMessageIds: [String!]!
}

input SaveSummaryEditInput {
  conversationId: ID!
  userId: String!
  content: String!
}

input AcquireLockInput {
  conversationId: ID!
  userId: String!
  operationType: String!
}

input ReleaseLockInput {
  conversationId: ID!
  userId: String!
}

input AskAIHelperInput {
  conversationId: ID!
  userId: String!
  actionType: String!
  userInput: String
  selectedMessageIds: [String]
}

input CreateConversationInput {
  createdBy: String!
}

input JoinConversationInput {
  loginId: String!
  conversationId: ID!
}

# ------ Responses ------

type CreateConversationResponse {
  success: Boolean!
  conversation: Conversation
  error: String
}

type JoinConversationResponse {
  success: Boolean!
  conversation: Conversation
  error: String
}

# ------ Queries ------

type Query {
  getConversation(conversationId: ID!): Conversation
  listConversations(loginId: ID!): [Conversation!]!
  listMessages(
    conversationId: ID!
    limit: Int
    nextToken: String
  ): MessageConnection!
  getSummary(conversationId: ID!): Summary
  getLocks(conversationId: ID!): [Lock!]!
}

type MessageConnection {
  items: [Message!]!
  nextToken: String
}

# ------ Mutations ------

type Mutation {
  createConversation(
    input: CreateConversationInput!
  ): CreateConversationResponse!
  joinConversation(input: JoinConversationInput!): JoinConversationResponse!
  # Subscription対応: 単純な型を返す
  sendMessage(input: SendMessageInput!): Message!
  updateSummary(input: UpdateSummaryInput!): Summary!
  undoSummary(conversationId: ID!): Summary!
  saveSummaryEdit(input: SaveSummaryEditInput!): Summary!
  acquireLock(input: AcquireLockInput!): Lock!
  releaseLock(input: ReleaseLockInput!): Lock!
  askAIHelper(input: AskAIHelperInput!): Message!
}

# ------ Subscriptions ------

type Subscription {
  onNewMessage(conversationId: ID!): Message
    @aws_subscribe(mutations: ["sendMessage"])
  onSummaryUpdate(conversationId: ID!): Summary
    @aws_subscribe(mutations: ["updateSummary", "saveSummaryEdit", "undoSummary"])
  onLockChange(conversationId: ID!): Lock
    @aws_subscribe(mutations: ["acquireLock", "releaseLock"])
}
